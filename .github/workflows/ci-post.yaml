name: 'Post CI'

#
# This workflow is for testing forks from PR
#
on:
  workflow_run:
    workflows:
      - CI
    branches-ignore:
      - master
      - development
      - feat-*
    types:
      - completed


permissions:
  contents: read    # python-report-test
  actions: read     # python-report-test
  checks: write     # python-report-test


jobs:


  #
  # This job is for adding unit and functional status reports from the python
  # workflow. It has been limited to python 3.11 as the default to confirm as a
  # proof-of-concept.
  #
  python-report-test:
    name: Python Test - Status
    if: >-
      github.event.workflow_run.conclusion == 'success'
        &&
      github.event.workflow_run.event == 'pull_request'
        &&
      github.event.workflow_run.head_repository.full_name != github.event.workflow_run.repository.full_name
    runs-on: ubuntu-latest
    steps:


      #
      # Questions to answer
      #    - Do originating workflow vars get passed to this workflow?
      #    - What vars if any are passed to this workflow?
      #
      - name: Trace
        shell: bash
        run:
          echo "***************** export env vars ****************";
          export;
          echo "***************** Do PR vars show? ****************";
          echo "${{ github.pull_request }}";
          echo "***************** ****************";
          
          echo "***************** ****************";


      - name: "[Trace] Dump event payload"
        shell: bash
        run: |
          jq . "$GITHUB_EVENT_PATH"


      - name: "[Trace] Dump environment"
        shell: bash
        run: |
          env | sort


      - name: "[Trace] Dump GitHub contexts"
        shell: bash
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
          INPUTS_CONTEXT: ${{ toJSON(inputs) }}
          VARS_CONTEXT: ${{ toJSON(vars) }}
          ENV_CONTEXT: ${{ toJSON(env) }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          STEPS_CONTEXT: ${{ toJSON(steps) }}
          RUNNER_CONTEXT: ${{ toJSON(runner) }}
          STRATEGY_CONTEXT: ${{ toJSON(strategy) }}
          MATRIX_CONTEXT: ${{ toJSON(matrix) }}
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          echo "===== github ====="
          echo "$GITHUB_CONTEXT"

          echo "===== inputs ====="
          echo "$INPUTS_CONTEXT"

          echo "===== vars ====="
          echo "$VARS_CONTEXT"

          echo "===== env ====="
          echo "$ENV_CONTEXT"

          echo "===== job ====="
          echo "$JOB_CONTEXT"

          echo "===== steps ====="
          echo "$STEPS_CONTEXT"

          echo "===== runner ====="
          echo "$RUNNER_CONTEXT"



      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1


      - name: Download Unit Test Report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c    # V8.0.1
        with:
          name: unit-test-results-3.11
          repository: nofusscomputing/centurion_erp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}


      - name: Unit Test Report
        if: success()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2    # v3.0.0
        id: test-report-unit
        with:
          # artifact: unit-test-results-${{ matrix.python-version }}
          name: Unit Test Report [Python 3.11]
          path: '*.xml'
          reporter: java-junit
          use-actions-summary: false


      - name: Clean-up Report
        shell: bash
        run:
          rm -f *.xml;

      - name: Download Functional Test Report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c    # V8.0.1
        if: success() || failure()
        with:
          name: functional-test-results-3.11
          repository: nofusscomputing/centurion_erp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}


      - name: Functional Test Report
        if: success() || failure()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2    # v3.0.0
        id: test-report-functional
        with:
          # artifact: functional-test-results-${{ matrix.python-version }}
          name: Functional Test Report [Python 3.11]
          path: '*.xml'
          reporter: java-junit
          # fail-on-error: false
          use-actions-summary: false


      - name: Clean-up Report
        shell: bash
        run:
          rm -f *.xml;
